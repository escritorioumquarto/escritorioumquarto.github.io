<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto | Umquarto</title>
    
    <style>
        /* ==========================================================================
           1. CORES E FONTES GLOBAIS 
           ========================================================================== */
        :root {
            --cor-fundo: #ffffff;
            --cor-texto: #1a1a1a;
            --cor-rodape: #f4f4f4;
            --cor-cinza: #666666; /* Tom de cinza para detalhes menores */
        }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap');

        * {
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            scroll-behavior: smooth;
        }

        /* ==========================================================================
           2. MENU SUPERIOR 
           ========================================================================== */
        nav {
            position: fixed;        
            top: 0; width: 100%;
            height: 80px; /* ALTURA FIXA DA BARRA BRANCA */
            padding: 0 50px; 
            display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(255, 255, 255, 0.95); 
            z-index: 1000; border-bottom: 1px solid #eaeaea;
        }

        nav .logo { display: flex; align-items: center; }

        /* 📏 TAMANHO DA LOGO */
        nav .logo img {
            max-height: 55px; 
            width: auto;
            object-fit: contain;
        }

        /* Os links mandam o usuário de volta para os blocos corretos da home */
        nav .menu-links a { 
            text-decoration: none; color: var(--cor-texto); margin-left: 30px; font-size: 14px; font-weight: 500; text-transform: uppercase; transition: 0.3s;
        }
        nav .menu-links a:hover { opacity: 0.5; }

        /* ==========================================================================
           3. CAPA HORIZONTAL DO PROJETO
           ========================================================================== */
        .projeto-hero {
            margin-top: 80px;       /* Cria espaço exato da barra fixa */
            width: 100%;
            height: 70vh;           /* Ocupa 70% da altura da tela */
        }
        .projeto-hero img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;      /* Garante o enquadramento sem achatar a foto */
        }

        /* ==========================================================================
           4. SEÇÃO DE TEXTOS: FICHA TÉCNICA À ESQUERDA E DESCRIÇÃO À DIREITA
           ========================================================================== */
        .projeto-info {
            display: flex;          /* Ativa o modo de colunas lado a lado */
            max-width: 1200px;
            margin: 80px auto;      /* Centraliza o bloco e cria espaço em cima e embaixo */
            padding: 0 50px;
            gap: 50px;              /* Espaço grande de separação entre as duas colunas */
        }

        /* Coluna da esquerda (Ficha técnica) */
        .ficha-tecnica {
            flex: 1;                /* Ocupa 1 "fatia" do espaço proporcional */
        }
        .ficha-tecnica h1 {
            font-size: 2.5rem; margin-top: 0; margin-bottom: 20px; font-weight: 400;
        }
        .ficha-tecnica p {
            margin: 8px 0; font-size: 0.95rem; color: var(--cor-cinza);
        }
        /* Destaca as palavras-chave em negrito preto */
        .ficha-tecnica span { 
            font-weight: 600; color: var(--cor-texto); 
        }

        /* Coluna da direita (Texto explicativo do projeto) */
        .descricao {
            flex: 2;                /* Ocupa 2 "fatias" do espaço (é duas vezes mais larga que a ficha) */
        }
        .descricao p {
            font-size: 1.1rem; line-height: 1.8; font-weight: 300; margin-top: 0; margin-bottom: 20px;
        }

        /* ==========================================================================
           5. GALERIA DE IMAGENS (Abaixo do texto)
           ========================================================================== */
        .galeria {
            max-width: 1200px;
            margin: 0 auto 80px auto; /* Centraliza e deixa margem grande antes do rodapé */
            padding: 0 50px;
            display: flex;
            flex-direction: column;   /* Empilha as fotos uma embaixo da outra */
            gap: 30px;                /* Distância vertical entre as fotos da galeria */
        }
        .galeria img {
            width: 100%;              /* Ocupa a largura total disponível */
            height: auto;             /* Ajusta a altura proporcionalmente de forma automática */
            display: block;
        }

        /* ==========================================================================
           6. RODAPÉ 
           ========================================================================== */
        footer {
            background-color: var(--cor-rodape);
            padding: 60px 50px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; font-size: 0.9rem;
        }
        /* Ajuste de margens para aproximar os textos do rodapé */
        footer h4 { margin: 0 0 5px 0; font-size: 1.2rem; }
        footer p { margin: 2px 0; color: var(--cor-cinza); }

        /* ==========================================================================
           7. AJUSTES PARA CELULAR
           ========================================================================== */
        @media (max-width: 768px) {
            /* No celular, a Ficha Técnica e a Descrição ficam uma embaixo da outra */
            .projeto-info { flex-direction: column; padding: 0 20px; gap: 30px; margin: 40px auto; }
            nav { height: auto; padding: 15px 20px; flex-direction: column; } 
            nav .menu-links { margin-top: 15px; }
            nav .menu-links a { margin: 0 10px; }
            nav .logo img { max-height: 45px; }
            .galeria { padding: 0 20px; }
            footer { grid-template-columns: 1fr; text-align: center; }
        }
    </style>
</head>
<body>

    <footer id="contato">

        </div>

</body>
</html>
